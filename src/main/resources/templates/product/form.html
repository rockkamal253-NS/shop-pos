<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Edit product' : 'New product', ~{::#page-content})}">
<head><title>Product form</title></head>
<body>
<div id="page-content" class="mx-auto max-w-3xl">

    <div class="mb-4">
        <a th:href="@{/products}" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800">
            <svg th:replace="~{fragments/icons :: arrow-left('h-4 w-4')}"></svg>
            Back to products
        </a>
    </div>

    <form th:action="${isEdit} ? @{/products/{id}(id=${form.id})} : @{/products}"
          method="post"
          th:object="${form}"
          class="card p-6">
        <input type="hidden" th:field="*{id}">

        <div class="grid gap-5 md:grid-cols-2">
            <div class="md:col-span-2">
                <label class="label" th:for="name">Product name</label>
                <input class="input" type="text" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                       placeholder="e.g. Basmati Rice 1kg">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div>
                <label class="label" th:for="sku">SKU</label>
                <input class="input" type="text" th:field="*{sku}"
                       th:classappend="${#fields.hasErrors('sku')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                       placeholder="e.g. GRC-001">
                <span class="field-error" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></span>
            </div>

            <div>
                <label class="label" th:for="barcode">Barcode</label>
                <input class="input" type="text" th:field="*{barcode}"
                       th:classappend="${#fields.hasErrors('barcode')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                       placeholder="Scan or type the barcode">
                <span class="field-error" th:if="${#fields.hasErrors('barcode')}" th:errors="*{barcode}"></span>
            </div>

            <div class="md:col-span-2">
                <label class="label" th:for="categoryId">Category</label>
                <select class="input" th:field="*{categoryId}"
                        th:classappend="${#fields.hasErrors('categoryId')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'">
                    <option value="">Select a category&hellip;</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></span>
            </div>

            <div>
                <label class="label" th:for="costPrice" th:text="'Cost price (' + ${@fmt.currency()} + ')'">Cost price</label>
                <input class="input num" type="number" step="any" min="0" th:field="*{costPrice}"
                       th:classappend="${#fields.hasErrors('costPrice')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'">
                <span class="field-error" th:if="${#fields.hasErrors('costPrice')}" th:errors="*{costPrice}"></span>
            </div>

            <div>
                <label class="label" th:for="sellPrice" th:text="'Sell price (' + ${@fmt.currency()} + ')'">Sell price</label>
                <input class="input num" type="number" step="any" min="0" th:field="*{sellPrice}"
                       th:classappend="${#fields.hasErrors('sellPrice')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'">
                <span class="field-error" th:if="${#fields.hasErrors('sellPrice')}" th:errors="*{sellPrice}"></span>
            </div>

            <div>
                <label class="label" th:for="stockQuantity"
                       th:text="${isEdit} ? 'Current stock' : 'Initial stock'">Initial stock</label>
                <input th:if="${!isEdit}" class="input num" type="number" min="0" th:field="*{stockQuantity}"
                       th:classappend="${#fields.hasErrors('stockQuantity')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'">
                <input th:if="${isEdit}" class="input num" type="number" th:value="${product.stockQuantity}" disabled>
                <span class="hint" th:if="${isEdit}">Change stock via the Stock page to keep the movement history accurate.</span>
                <span class="field-error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></span>
            </div>

            <div>
                <label class="label" th:for="lowStockThreshold">Low-stock threshold</label>
                <input class="input num" type="number" min="0" th:field="*{lowStockThreshold}"
                       th:classappend="${#fields.hasErrors('lowStockThreshold')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'">
                <span class="field-error" th:if="${#fields.hasErrors('lowStockThreshold')}" th:errors="*{lowStockThreshold}"></span>
            </div>

            <div class="md:col-span-2 flex items-center gap-2.5">
                <input type="checkbox" id="active" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500/25" th:field="*{active}">
                <label for="active" class="text-sm text-slate-700">Active (visible on the register)</label>
            </div>
        </div>

        <div class="mt-6 flex justify-end gap-2 border-t border-slate-200 pt-4">
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Save changes' : 'Create product'">Save</button>
        </div>
    </form>
</div>
</body>
</html>
