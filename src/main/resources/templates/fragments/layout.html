<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:attr="content=${_csrf != null} ? ${_csrf.token}" content="">
    <meta name="_csrf_header" th:attr="content=${_csrf != null} ? ${_csrf.headerName}" content="X-CSRF-TOKEN">
    <title th:text="${pageTitle}">ShopPOS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/vendor/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="bg-slate-50 font-sans text-sm text-slate-800">

<!-- Sidebar: collapses to icons below 1024px -->
<aside class="fixed inset-y-0 left-0 z-40 w-14 border-r border-slate-200 bg-white lg:w-56">
    <div class="flex h-16 items-center gap-2.5 border-b border-slate-200 px-3 lg:px-5">
        <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-primary-600 text-white">
            <svg th:replace="~{fragments/icons :: pos('h-5 w-5')}"></svg>
        </span>
        <span class="hidden text-base font-semibold text-slate-900 lg:block">ShopPOS</span>
    </div>
    <nav class="space-y-1 p-2 lg:p-3" aria-label="Main">
        <a th:if="${isAdmin}" th:href="@{/admin/dashboard}" title="Dashboard"
           th:classappend="${currentPath.startsWith('/admin')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: dashboard('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Dashboard</span>
        </a>
        <a th:href="@{/pos}" title="Register"
           th:classappend="${currentPath.startsWith('/pos')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: cart('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Register</span>
        </a>
        <a th:href="@{/products}" title="Products"
           th:classappend="${currentPath.startsWith('/products')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: package('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Products</span>
        </a>
        <a th:if="${isAdmin}" th:href="@{/categories}" title="Categories"
           th:classappend="${currentPath.startsWith('/categories')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: tags('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Categories</span>
        </a>
        <a th:if="${isAdmin}" th:href="@{/inventory/adjust}" title="Stock"
           th:classappend="${currentPath.startsWith('/inventory')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: archive('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Stock</span>
        </a>
        <a th:if="${isAdmin}" th:href="@{/sales}" title="Sales History"
           th:classappend="${currentPath.startsWith('/sales')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: history('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Sales History</span>
        </a>
        <a th:if="${isAdmin}" th:href="@{/admin/users}" title="Users"
           th:classappend="${currentPath.startsWith('/admin/users')} ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'"
           class="flex h-10 items-center gap-3 rounded-md px-2.5 lg:px-3">
            <svg th:replace="~{fragments/icons :: users('h-5 w-5')}"></svg>
            <span class="hidden lg:inline">Users</span>
        </a>
    </nav>
</aside>

<div class="ml-14 lg:ml-56">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 lg:px-8">
        <h1 class="truncate text-xl font-semibold text-slate-900" th:text="${pageTitle}">Page</h1>
        <div class="flex items-center gap-3">
            <span class="hidden items-center gap-2.5 sm:flex">
                <span class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-slate-500">
                    <svg th:replace="~{fragments/icons :: user('h-5 w-5')}"></svg>
                </span>
                <span class="leading-tight">
                    <span class="block font-medium text-slate-800" th:text="${currentUserName}">User</span>
                    <span class="block text-xs text-slate-500"
                          th:text="${currentUserRole == 'ADMIN'} ? 'Administrator' : 'Cashier'">Role</span>
                </span>
            </span>
            <a th:href="@{/account/password}" class="btn btn-secondary" title="Change password">
                <svg th:replace="~{fragments/icons :: pencil('h-4 w-4')}"></svg>
                <span class="hidden md:inline">Change password</span>
            </a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-secondary" title="Sign out">
                    <svg th:replace="~{fragments/icons :: logout('h-4 w-4')}"></svg>
                    <span class="hidden md:inline">Sign out</span>
                </button>
            </form>
        </div>
    </header>

    <main class="mx-auto w-full max-w-7xl px-4 py-6 lg:px-8">
        <th:block th:replace="${content}"></th:block>
    </main>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed right-4 top-20 z-50 flex w-80 flex-col gap-2" aria-live="polite"></div>

<!-- Confirmation dialog for destructive actions -->
<dialog id="confirm-dialog"
        class="w-96 rounded-lg border border-slate-200 bg-white p-6 shadow-lg backdrop:bg-slate-900/40">
    <div class="flex items-start gap-3">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-danger-50 text-danger-600">
            <svg th:replace="~{fragments/icons :: alert('h-5 w-5')}"></svg>
        </span>
        <div>
            <h2 class="text-base font-semibold text-slate-900" id="confirm-title">Are you sure?</h2>
            <p class="mt-1 text-slate-500" id="confirm-message">This action cannot be undone.</p>
        </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
        <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
    </div>
</dialog>

<!-- Flash toasts for classic (non-HTMX) form flows -->
<th:block th:if="${toastSuccess}">
    <script th:inline="javascript">window.addEventListener('load', () => showToast(/*[[${toastSuccess}]]*/ '', 'success'));</script>
</th:block>
<th:block th:if="${toastError}">
    <script th:inline="javascript">window.addEventListener('load', () => showToast(/*[[${toastError}]]*/ '', 'error'));</script>
</th:block>

</body>
</html>
