<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${form.id == null} ? 'New category' : 'Edit category', ~{::#page-content})}">
<head><title>Category form</title></head>
<body>
<div id="page-content" class="mx-auto max-w-md">

    <div class="mb-4">
        <a th:href="@{/categories}" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800">
            <svg th:replace="~{fragments/icons :: arrow-left('h-4 w-4')}"></svg>
            Back to categories
        </a>
    </div>

    <form th:action="${form.id == null} ? @{/categories} : @{/categories/{id}(id=${form.id})"
          method="post" th:object="${form}" class="card p-6">
        <input type="hidden" th:field="*{id}">
        <div>
            <label class="label" th:for="name">Category name</label>
            <input class="input" type="text" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                   placeholder="e.g. Beverages">
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="mt-6 flex justify-end gap-2 border-t border-slate-200 pt-4">
            <a th:href="@{/categories}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${form.id == null} ? 'Create' : 'Save changes'">Save</button>
        </div>
    </form>
</div>
</body>
</html>
