<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Users', ~{::#page-content})}">
<head><title>Users</title></head>
<body>
<div id="page-content" class="space-y-6">

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
        <!-- New user card -->
        <div class="lg:col-span-1">
            <form th:action="@{/admin/users}" method="post" class="card p-6 space-y-4">
                <div>
                    <h2 class="text-base font-semibold text-slate-900">New user</h2>
                    <p class="text-sm text-slate-500">Create a new local account.</p>
                </div>

                <div>
                    <label class="label" for="username">Username</label>
                    <input class="input" type="text" id="username" name="username" required pattern="[a-z0-9._-]{3,50}" autocomplete="username" autofocus>
                    <p class="mt-1 text-xs text-slate-400">3-50 characters: lowercase letters, digits, dot, dash or underscore.</p>
                </div>

                <div>
                    <label class="label" for="displayName">Display name</label>
                    <input class="input" type="text" id="displayName" name="displayName" required maxlength="100">
                </div>

                <div>
                    <label class="label" for="role">Role</label>
                    <select class="input" id="role" name="role" required>
                        <option value="CASHIER" selected>Cashier</option>
                        <option value="ADMIN">Administrator</option>
                    </select>
                </div>

                <div>
                    <label class="label" for="password">Password</label>
                    <input class="input" type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
                </div>

                <div>
                    <label class="label" for="confirmPassword">Confirm password</label>
                    <input class="input" type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="72" autocomplete="new-password">
                </div>

                <div class="pt-2">
                    <button type="submit" class="btn btn-primary w-full">Create user</button>
                </div>
            </form>
        </div>

        <!-- Users table -->
        <div class="lg:col-span-2">
            <div class="table-wrap">
                <table class="data">
                    <thead>
                    <tr>
                        <th class="th">Username</th>
                        <th class="th">Display name</th>
                        <th class="th">Role</th>
                        <th class="th">Status</th>
                        <th class="th">Created</th>
                        <th class="th">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="row-hover" th:each="u : ${users}">
                        <td class="td font-medium text-slate-800" th:text="${u.username}">admin</td>
                        <td class="td text-slate-600" th:text="${u.displayName}">Administrator</td>
                        <td class="td text-slate-600" th:text="${u.role == T(com.example.shoppos.user.Role).ADMIN ? 'Administrator' : 'Cashier'}">Administrator</td>
                        <td class="td">
                            <span th:if="${u.enabled}" class="badge badge-success">Enabled</span>
                            <span th:unless="${u.enabled}" class="badge badge-danger">Disabled</span>
                        </td>
                        <td class="td whitespace-nowrap text-slate-500" th:text="${@fmt.dateTime(u.createdAt)}">date</td>
                        <td class="td">
                            <span th:if="${currentUserId != null and currentUserId == u.id}" class="text-xs font-medium text-slate-400">You</span>
                            <div th:unless="${currentUserId != null and currentUserId == u.id}" class="flex items-center gap-2">
                                <form th:action="@{/admin/users/{id}/enabled(id=${u.id})}" method="post" class="inline">
                                    <input type="hidden" name="enabled" th:value="${!u.enabled}">
                                    <button type="submit"
                                            th:class="${u.enabled} ? 'btn btn-secondary btn-sm text-danger-600 hover:bg-danger-50' : 'btn btn-secondary btn-sm text-success-600 hover:bg-success-50'"
                                            th:text="${u.enabled} ? 'Disable' : 'Enable'">
                                        Disable
                                    </button>
                                </form>
                                <details class="inline-block text-left">
                                    <summary class="btn btn-secondary btn-sm cursor-pointer list-none">
                                        Reset password
                                    </summary>
                                    <div class="mt-2 w-64 rounded-md border border-slate-200 bg-white p-3 shadow-md">
                                        <form th:action="@{/admin/users/{id}/password(id=${u.id})}" method="post" class="space-y-2">
                                            <div>
                                                <label class="label text-xs" th:for="${'newPassword-' + u.id}">New password</label>
                                                <input class="input h-8 text-xs" type="password" th:id="${'newPassword-' + u.id}" name="newPassword"
                                                       required minlength="8" maxlength="72" autocomplete="new-password">
                                            </div>
                                            <div>
                                                <label class="label text-xs" th:for="${'confirmPassword-' + u.id}">Confirm password</label>
                                                <input class="input h-8 text-xs" type="password" th:id="${'confirmPassword-' + u.id}" name="confirmPassword"
                                                       required minlength="8" maxlength="72" autocomplete="new-password">
                                            </div>
                                            <button type="submit" class="btn btn-primary btn-sm w-full">Update</button>
                                        </form>
                                    </div>
                                </details>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
