<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Change password', ~{::#page-content})}">
<head><title>Change password</title></head>
<body>
<div id="page-content" class="mx-auto max-w-lg">

    <div class="mb-4">
        <a th:href="@{/}" class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800">
            <svg th:replace="~{fragments/icons :: arrow-left('h-4 w-4')}"></svg>
            Back to dashboard
        </a>
    </div>

    <form th:action="@{/account/password}"
          method="post"
          th:object="${form}"
          class="card p-6 space-y-4">

        <div>
            <h2 class="text-base font-semibold text-slate-900">Change your password</h2>
            <p class="text-sm text-slate-500">Choose a new password between 8 and 72 characters.</p>
        </div>

        <div>
            <label class="label" th:for="currentPassword">Current password</label>
            <input class="input" type="password" th:field="*{currentPassword}"
                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                   autocomplete="current-password" autofocus required>
            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        </div>

        <div>
            <label class="label" th:for="newPassword">New password</label>
            <input class="input" type="password" th:field="*{newPassword}"
                   th:classappend="${#fields.hasErrors('newPassword')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                   autocomplete="new-password" required minlength="8" maxlength="72">
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </div>

        <div>
            <label class="label" th:for="confirmPassword">Confirm new password</label>
            <input class="input" type="password" th:field="*{confirmPassword}"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-danger-500 focus:border-danger-500 focus:ring-danger-500/25'"
                   autocomplete="new-password" required minlength="8" maxlength="72">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Change password</button>
        </div>
    </form>
</div>
</body>
</html>
