<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — ShopPOS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-50 font-sans text-sm text-slate-800">
<main class="w-full max-w-sm px-4">
    <div class="mb-8 flex flex-col items-center gap-2.5">
        <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-primary-600 text-white">
            <svg th:replace="~{fragments/icons :: pos('h-6 w-6')}"></svg>
        </span>
        <h1 class="text-xl font-semibold text-slate-900">ShopPOS</h1>
        <p class="text-slate-500">Sign in to your account</p>
    </div>

    <div class="card p-6">
        <div th:if="${errorMessage}"
             class="mb-4 flex items-start gap-2 rounded-md border border-danger-500/30 bg-danger-50 px-3 py-2.5 text-danger-700">
            <svg th:replace="~{fragments/icons :: alert('h-4 w-4 mt-0.5')}"></svg>
            <span th:text="${errorMessage}">Error</span>
        </div>
        <div th:if="${logoutMessage}"
             class="mb-4 flex items-start gap-2 rounded-md border border-success-500/30 bg-success-50 px-3 py-2.5 text-success-700">
            <svg th:replace="~{fragments/icons :: check('h-4 w-4 mt-0.5')}"></svg>
            <span th:text="${logoutMessage}">Signed out</span>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="label" for="username">Username</label>
                <input class="input" type="text" id="username" name="username"
                       autocomplete="username" autofocus required>
            </div>
            <div>
                <label class="label" for="password">Password</label>
                <input class="input" type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">ShopPOS — internal staff tool</p>
</main>
</body>
</html>
