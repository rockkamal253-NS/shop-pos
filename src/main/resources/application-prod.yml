spring:
  datasource:
    url: ${PROD_DB_URL:jdbc:postgresql://localhost:5432/shoppos}
    driver-class-name: org.postgresql.Driver
    username: ${PROD_DB_USER:shoppos}
    password: ${PROD_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

