spring:
  application:
    name: shop-pos
  jpa:
    open-in-view: false
  flyway:
    enabled: true

app:
  # Single source of truth for money display. All amounts are BigDecimal scale 2.
  currency: EGP
  shop-name: Corner Store
  timezone: Africa/Cairo
  max-cashier-discount-percent: 20
  security:
    max-login-attempts: 5
    lock-minutes: 10
    max-tracked-usernames: 10000
  admin:
    # Seeded at startup (BCrypt-encoded) only if the username does not exist yet.
    # Override via environment variables APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD in production.
    username: admin
    display-name: Store Admin
