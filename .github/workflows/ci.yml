name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify
      - name: Fail if any test was skipped
        run: |
          if grep -lE '<testsuite [^>]*skipped="[1-9]' target/surefire-reports/TEST-*.xml; then
            echo "Skipped tests found - the PostgreSQL (Testcontainers) tests did not run."
            exit 1
          fi
